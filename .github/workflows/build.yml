name: Build Premium Music Player APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java (Fixed Warning)
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Fresh Android Setup
      run: |
        rm -rf android
        flutter create --platforms android .

    - name: Fix Android Min SDK Version (Kotlin & Groovy Support)
      run: |
        sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
        sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle.kts || true

    - name: Install Dependencies
      run: flutter pub get

    - name: Build APK (With Retry Logic)
      run: |
        flutter build apk --release || flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Premium-Music-Player
        path: build/app/outputs/flutter-apk/app-release.apk
