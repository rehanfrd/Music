name: Build Premium Music Player APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java (Downgraded to 11 to match Kotlin)
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Fresh Android Setup
      run: |
        rm -rf android
        flutter create --platforms android .

    - name: Fix Android Min SDK Version
      run: |
        sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
        sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle.kts || true

    - name: Install Dependencies
      run: flutter pub get

    - name: Fix on_audio_query Namespace Issue
      run: |
        sed -i '/android {/a \    namespace "com.lucasjosino.on_audio_query"' /home/runner/.pub-cache/hosted/pub.dev/on_audio_query_android-*/android/build.gradle || true

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Premium-Music-Player
        path: build/app/outputs/flutter-apk/app-release.apk
